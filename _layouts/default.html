<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if page.title %}
        {{ page.title }} · {{ site.title }}
        {% else if site.slogan %}
        {{ site.title }} · {{ site.slogan }}
        {% else %}
        {{ site.title }}
        {% endif %}
    </title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/icon.svg' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicon-16x16.png' | relative_url }}">

    <meta property="og:title"
        content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else if site.slogan %}{{ site.title }} · {{ site.slogan }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{{ '/assets/img/social.png' | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title"
        content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else if site.slogan %}{{ site.title }} · {{ site.slogan }}{% else %}{{ site.title }}{% endif %}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ '/assets/img/social.png' | absolute_url }}">

    <meta name="theme-color" content="#2E7D32">

    <link rel="preload" href="{{ '/assets/css/tabler-icons.min.css' | relative_url }}" as="style">
    <link rel="preload" href="{{ '/assets/css/site.css' | relative_url }}" as="style">

    <link rel="stylesheet" href="{{ '/assets/css/tabler-icons.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>

<body>
    {% include header.html %}

    {% if page.hero %}
    {% include hero.html %}
    {% endif %}

    <main class="page-content">
        {{ content }}
    </main>

    <footer class="footer">
        <p>© {{ site.time | date: "%Y" }} Healthy</p>
    </footer>
</body>

</html>
