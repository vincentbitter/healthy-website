name: Write release article

on:
  repository_dispatch:
    types: [new_release]

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.4.0)"
        required: true
      published_at:
        description: "Release date"
        required: true
      url:
        description: "Release URL"
        required: true
      url_json:
        description: "Release URL JSON"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Get received data
        id: data
        run: |
          RELEASE_VERSION="${{ github.event.client_payload.version || inputs.version }}"
          RELEASE_DATE="${{ github.event.client_payload.published_at || inputs.published_at }}"
          RELEASE_URL="${{ github.event.client_payload.url || inputs.url }}"
          RELEASE_URL_JSON="${{ github.event.client_payload.url_json || inputs.url_json }}"
          echo "Version: $RELEASE_VERSION"
          echo "Published: $RELEASE_DATE"
          echo "URL: $RELEASE_URL"
          echo "URL JSON: $RELEASE_URL_JSON"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "published_at=$RELEASE_DATE" >> "$GITHUB_OUTPUT"
          echo "url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "url_json=$RELEASE_URL_JSON" >> "$GITHUB_OUTPUT"

      - name: Checkout website repo
        uses: actions/checkout@v6
        with:
          path: website
      
      - name: Checkout Healthy repo
        uses: actions/checkout@v6
        with:
          repository: vincentbitter/healthy
          path: plugin

      - name: Assure content folders
        run: |
          mkdir -p website/_changelogs
          mkdir -p website/_posts

      - name: Fetch latest Healthy release
        id: release
        run: |
          RELEASE=$(curl -s "${{ steps.data.outputs.url_json }}")
          TAG=$(echo "$RELEASE" | jq -r .tag_name)
          NAME=$(echo "$RELEASE" | jq -r .name)
          BODY=$(echo "$RELEASE" | jq -r .body)
          DATE=$(date +"%Y-%m-%d")

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Create changelog file
        run: |
          FILE="website/_changelogs/${{ steps.data.outputs.version }}.md"
          cat > "$FILE" <<'EOF'
---
layout: post
title: "Healthy ${{ steps.data.outputs.version }}"
date: ${{ steps.release.outputs.date }}
excerpt: "Changelog for Healthy ${{ steps.data.outputs.version }}."
---
${{ steps.release.outputs.body }}
EOF

      - name: Check if news file already exists
        id: exists
        run: |
          FILE="website/_posts/${{ steps.release.outputs.date }}-${{ steps.release.outputs.tag }}.md"
          if [ -f "$FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch previous release tag
        id: previous
        if: steps.exists.outputs.exists == 'false'
        run: |
          ALL_RELEASES=$(curl -s https://api.github.com/repos/vincentbitter/healthy/releases)
          PREV=$(echo "$ALL_RELEASES" | jq -r '[.[] | select(.prerelease == false)][1].tag_name')
          if [ "$PREV" = "null" ] || [ -z "$PREV" ]; then
            PREV=""
          fi

          echo "previous=$PREV" >> $GITHUB_OUTPUT

      - name: Copy release-description.sh into plugin repo
        run: |
          cp .github/release-description.sh plugin/
          chmod +x plugin/release-description.sh

      - name: Write news article
        id: article
        if: steps.exists.outputs.exists == 'false'
        run: |
          BASE="${{ steps.previous.outputs.previous }}"
          HEAD="${{ steps.release.outputs.tag }}"
          cd plugin
          OUTPUT=$(./release-description.sh "$BASE" "$HEAD")
          cd ..
          echo "$OUTPUT"

          # Parse JSON
          TITLE=$(echo "$OUTPUT" | jq -r '.title // empty')
          SLUG=$(echo "$OUTPUT" | jq -r '.slug // empty')
          EXCERPT=$(echo "$OUTPUT" | jq -r '.excerpt // empty')
          BODY=$(echo "$OUTPUT" | jq -r '.body // empty')
          ERROR=$(echo "$OUTPUT" | jq -r '.error // empty')

          if [[ -n "$ERROR" ]]; then
            echo "error=$ERROR" >> $GITHUB_OUTPUT
            echo "❌ Release description failed: $ERROR"
            exit 1
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "excerpt=$EXCERPT" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT


      - name: Create news file
        if: steps.exists.outputs.exists == 'false'
        run: |
          FILE="website/_posts/${{ steps.release.outputs.date }}-${{ steps.article.outputs.slug }}.md"
          cat > "$FILE" <<'EOF'
---
layout: post
title: "${{ steps.article.outputs.title }}"
date: ${{ steps.release.outputs.date }}
excerpt: "${{ steps.article.outputs.excerpt }}"
---

${{ steps.article.outputs.body }}

## Changes since ${{ steps.previous.outputs.previous }}

\`\`\`diff
{% include_relative ../_changelogs/${{ steps.data.outputs.version }}.md %}
\`\`\`
EOF

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          path: website
          commit-message: "docs(news): add release ${{ steps.data.outputs.version }}"
          branch: "news/release-${{ steps.data.outputs.version }}"
          title: "Add news item for release ${{ steps.data.outputs.version }}"
          body: |
            Changelog and automatically generated news item for Healthy release **${{ steps.get_received_data.outputs.version }}**.

            Includes:
            - Release notes
            - Diff vs previous release (**${{ steps.previous.outputs.previous }}**)