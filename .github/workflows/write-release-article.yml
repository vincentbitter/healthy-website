name: Write release article

on:
  repository_dispatch:
    types: [new_release]

  workflow_dispatch:
    inputs:
      url_json:
        description: "Release URL JSON"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Get received data
        id: data
        run: |
          RELEASE_URL_JSON="${{ github.event.client_payload.url_json || inputs.url_json }}"
          echo "URL JSON: $RELEASE_URL_JSON"
          echo "url_json=$RELEASE_URL_JSON" >> "$GITHUB_OUTPUT"

      - name: Checkout website repo
        uses: actions/checkout@v6
        with:
          path: website

      - name: Fetch latest Healthy release
        id: release
        run: |
          RELEASE=$(curl -s "${{ steps.data.outputs.url_json }}")
          TAG=$(echo "$RELEASE" | jq -r .tag_name)
          VERSION=$(echo "$RELEASE" | jq -r .tag_name)
          BODY=$(echo "$RELEASE" | jq -r .body)
          DATE=$(date +"%Y-%m-%d")

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
      
      - name: Checkout Healthy repo
        uses: actions/checkout@v6
        with:
          repository: vincentbitter/healthy
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          path: plugin

      - name: Assure content folders
        run: |
          mkdir -p website/_includes/changelogs
          mkdir -p website/_changelogs
          mkdir -p website/_posts

      - name: Check if changelog file already exists
        id: exists
        run: |
          FILE="website/_includes/${{ steps.release.outputs.version }}.md"
          if [ -f "$FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create changelog file
        run: |
          BODY=$(echo "${{ steps.release.outputs.body }}" | sed '1{/^#/d}')

          echo "$BODY" >> website/_changelogs/$VERSION.md

      - name: Create changelog article file
        run: |
          export VERSION="${{ steps.release.outputs.version }}"
          export DATE="${{ steps.release.outputs.date }}"

          envsubst < website/.github/changelog-article-template.md \
            > "website/_changelogs/$VERSION.md"

      - name: Fetch previous release tag
        id: previous
        if: steps.exists.outputs.exists == 'false'
        run: |
          ALL_RELEASES=$(curl -s https://api.github.com/repos/vincentbitter/healthy/releases)
          PREV=$(echo "$ALL_RELEASES" | jq -r '[.[] | select(.prerelease == false)][1].tag_name')
          if [ "$PREV" = "null" ] || [ -z "$PREV" ]; then
            PREV=""
          fi

          echo "previous=$PREV" >> $GITHUB_OUTPUT

      - name: Copy release-description.sh into plugin repo
        run: |
          cp website/.github/release-description.sh plugin/
          chmod +x plugin/release-description.sh

      - name: Write news article
        id: article
        if: steps.exists.outputs.exists == 'false'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          BASE="${{ steps.previous.outputs.previous }}"
          HEAD="${{ steps.release.outputs.tag }}"
          cd plugin
          OUTPUT=$(./release-description.sh $BASE $HEAD)
          cd ..
          echo "$OUTPUT"

          # Parse JSON
          TITLE=$(echo "$OUTPUT" | jq -r '.title // empty')
          SLUG=$(echo "$OUTPUT" | jq -r '.slug // empty')
          EXCERPT=$(echo "$OUTPUT" | jq -r '.excerpt // empty')
          BODY=$(echo "$OUTPUT" | jq -r '.body // empty')
          ERROR=$(echo "$OUTPUT" | jq -r '.error // empty')

          if [[ -n "$ERROR" ]]; then
            echo "error=$ERROR" >> $GITHUB_OUTPUT
            echo "❌ Release description failed: $ERROR"
            exit 1
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "excerpt=$EXCERPT" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create news file
        if: steps.exists.outputs.exists == 'false'
        run: |
          mkdir -p website/_posts
          export VERSION="${{ steps.release.outputs.version }}"
          export DATE="${{ steps.release.outputs.date }}"
          export TITLE="${{ steps.article.outputs.title }}"
          export EXCERPT="${{ steps.article.outputs.excerpt }}"
          export BODY="${{ steps.article.outputs.body }}"
          export PREVIOUS="${{ steps.previous.outputs.previous }}"

          envsubst < website/.github/release-news-template.md \
            > "website/_posts/${DATE}-${{ steps.article.outputs.slug }}.md"
          
      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          path: website
          commit-message: "docs(news): add release ${{ steps.release.outputs.version }}"
          branch: "news/release-${{ steps.release.outputs.version }}"
          title: "Add news item for release ${{ steps.release.outputs.version }}"
          body: |
            Changelog and automatically generated news item for Healthy release **${{ steps.release.outputs.version }}**.

            Includes:
            - Release notes
            - Diff vs previous release (**${{ steps.previous.outputs.previous }}**)